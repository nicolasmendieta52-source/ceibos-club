<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#0b281a" />
    <link rel="icon" type="image/png" href="/assets/icono-app-ceibos.png" />
    <link rel="apple-touch-icon" href="/assets/icono-app-ceibos.png" />
    <title>Ceibos Club · Sitio en construcción</title>
    <style>
      :root {
        color-scheme: dark;
        --green-950: #071b12;
        --green-900: #0b281a;
        --green-800: #123c29;
        --gold: #efc44f;
        --gold-soft: #f6d879;
        --cream: #f8f4e8;
        --muted: #bcc9c0;
        --danger: #ffc7bc;
      }

      * { box-sizing: border-box; }

      html { min-height: 100%; background: var(--green-950); }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        color: var(--cream);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 50% 28%, rgba(239, 196, 79, 0.12), transparent 23rem),
          linear-gradient(145deg, var(--green-950), var(--green-800));
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 28rem;
        height: 28rem;
        border: 1px solid rgba(239, 196, 79, 0.12);
        border-radius: 50%;
        pointer-events: none;
      }

      body::before { left: -17rem; top: -15rem; }
      body::after { right: -18rem; bottom: -17rem; }

      main {
        width: min(92%, 36rem);
        padding: max(2rem, env(safe-area-inset-top)) 0 max(2rem, env(safe-area-inset-bottom));
        text-align: center;
      }

      .logo {
        width: clamp(7.5rem, 24vw, 10rem);
        height: auto;
        filter: drop-shadow(0 1rem 2.5rem rgba(0, 0, 0, 0.28));
        animation: logo-in 700ms cubic-bezier(.2, .8, .2, 1) both;
      }

      .eyebrow {
        margin: 1.5rem 0 0.8rem;
        color: var(--gold);
        font-size: 0.74rem;
        font-weight: 800;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 9vw, 4.6rem);
        line-height: 0.95;
        letter-spacing: -0.045em;
      }

      h1 span { display: block; color: var(--gold); }

      .intro {
        max-width: 30rem;
        margin: 1.25rem auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 3vw, 1.08rem);
        line-height: 1.6;
      }

      .access-card {
        margin-top: 2rem;
        padding: 1.2rem;
        border: 1px solid rgba(239, 196, 79, 0.2);
        border-radius: 1.35rem;
        background: rgba(4, 23, 14, 0.62);
        box-shadow: 0 1.4rem 4rem rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(14px);
      }

      .access-title {
        margin: 0 0 0.9rem;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      form { display: grid; grid-template-columns: 1fr auto; gap: 0.65rem; }

      input,
      button {
        min-height: 3.25rem;
        border-radius: 0.9rem;
        font: inherit;
      }

      input {
        width: 100%;
        min-width: 0;
        border: 1px solid rgba(248, 244, 232, 0.22);
        outline: none;
        padding: 0 1rem;
        color: var(--cream);
        background: rgba(255, 255, 255, 0.07);
      }

      input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(239, 196, 79, 0.13); }

      button {
        border: 0;
        padding: 0 1.25rem;
        color: var(--green-950);
        font-weight: 850;
        cursor: pointer;
        background: linear-gradient(135deg, var(--gold-soft), var(--gold));
      }

      button:hover { filter: brightness(1.05); transform: translateY(-1px); }
      button:disabled { cursor: not-allowed; filter: grayscale(1); opacity: 0.5; }

      .access-message,
      .setup-message {
        display: none;
        margin: 0 0 0.85rem;
        font-size: 0.9rem;
      }

      .access-message { color: var(--danger); }
      .setup-message { color: var(--gold-soft); }
      .access-message.is-visible,
      .setup-message.is-visible { display: block; }

      footer {
        margin-top: 1.5rem;
        color: rgba(248, 244, 232, 0.52);
        font-size: 0.76rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      @keyframes logo-in {
        from { opacity: 0; transform: translateY(0.75rem) scale(0.94); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @media (max-width: 34rem) {
        main { width: min(90%, 28rem); }
        form { grid-template-columns: 1fr; }
        button { width: 100%; }
      }

      @media (prefers-reduced-motion: reduce) {
        .logo { animation: none; }
        button { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/assets/escudo-ceibos.png" alt="Escudo oficial de Ceibos Club" width="512" height="512" />
      <p class="eyebrow">Totus Tuus · Desde 2014</p>
      <h1>Estamos <span>construyendo</span></h1>
      <p class="intro">
        Estamos preparando la nueva web de Ceibos Club. Muy pronto vas a encontrar acá toda la vida deportiva del club.
      </p>

      <section class="access-card" aria-labelledby="access-title">
        <p class="access-title" id="access-title">Acceso del equipo</p>
        <p class="{{ERROR_CLASS}}" role="alert">{{ERROR_MESSAGE}}</p>
        <p class="{{SETUP_CLASS}}" role="status">{{SETUP_MESSAGE}}</p>
        <form action="/__acceso" method="post">
          <input type="hidden" name="redirect" value="{{REDIRECT}}" />
          <input
            type="password"
            name="code"
            placeholder="Código de acceso"
            aria-label="Código de acceso"
            autocomplete="current-password"
            required
            {{FORM_DISABLED}}
          />
          <button type="submit" {{FORM_DISABLED}}>Ingresar</button>
        </form>
      </section>

      <footer>Ceibos Club · Montevideo, Uruguay</footer>
    </main>
  </body>
</html>
