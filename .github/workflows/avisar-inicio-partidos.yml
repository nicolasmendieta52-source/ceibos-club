name: Avisar inicio de partidos

on:
  schedule:
    # GitHub ejecuta cron en UTC. Revisamos cada cinco minutos y el programa
    # compara la hora oficial del partido con la hora de Montevideo.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos-club
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Avisar partidos que comienzan ahora
        run: npm run notify:club -- --start-only
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      - name: Guardar avisos enviados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notification-state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: registrar avisos de inicio"
          for intento in 1 2 3; do
            git fetch origin main
            git merge --no-edit -X ours origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
