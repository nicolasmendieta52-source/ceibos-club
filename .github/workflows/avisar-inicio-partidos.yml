name: Avisar inicio de partidos

on:
  schedule:
    # Despierta el vigilante con anticipación. Una vez activo, los envíos usan
    # temporizadores por partido; no esperan a la siguiente revisión de cron.
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: ["Actualizar datos del club"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Comprobar horarios sin enviar notificaciones"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: avisar-inicio-partidos
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 195
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preparar cinco minutos antes y enviar a la hora del fixture
        run: node automation/watch-match-starts.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          GITHUB_TOKEN: ${{ github.token }}
          NOTIFICATIONS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      - name: Guardar avisos enviados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notification-state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: registrar avisos de inicio"
          for intento in 1 2 3; do
            git fetch origin main
            git merge --no-edit -X ours origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
