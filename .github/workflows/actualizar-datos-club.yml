name: Actualizar datos del club

on:
  push:
    paths:
      - "automation/**"
      - "package.json"
      - ".github/workflows/actualizar-datos-club.yml"
  schedule:
    # Cuatro lecturas por día mantienen el consumo de Apify dentro
    # del crédito mensual gratuito sin perder las novedades del club.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos-club
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Guardar fixture anterior para detectar novedades
        run: cp data/club-data.json "$RUNNER_TEMP/club-data-before.json"
      - run: npm run sync:club
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_INSTAGRAM_RESULTS_LIMIT: "5"
      - name: Enviar notificaciones de partidos
        continue-on-error: true
        run: npm run notify:club -- --previous "$RUNNER_TEMP/club-data-before.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      - name: Guardar datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/club-data.json data/instagram-ocr-cache.json data/notification-state.json
          git diff --cached --quiet || git commit -m "chore: actualizar fixture y resultados"
          # Si alguien sube cambios mientras se ejecuta el OCR, incorporamos
          # ese nuevo commit y conservamos los datos que acaba de generar el
          # workflow. Reintentamos el push para evitar falsos fallos rojos por
          # una carrera entre la actualización automática y una carga manual.
          for intento in 1 2 3; do
            git fetch origin main
            git merge --no-edit -X ours origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "El repositorio cambió durante el guardado; reintento ${intento}/3"
            sleep 3
          done
          echo "No se pudieron guardar los datos después de 3 intentos"
          exit 1
